<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Criador de capas</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/app-icon.png" type="image/png" sizes="192x192">
  <link rel="preload" href="/fonts/archivo.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header class="band">
    <a class="band-brand" href="#/" aria-label="Início">
      <span class="band-mark" aria-hidden="true"></span>
      <img class="band-logo" id="bandLogo" alt="" hidden>
      <span class="band-title" id="bandTitle">Criador de capas</span>
    </a>
    <div class="band-actions">
      <button class="band-help" id="openHelp" type="button" aria-label="Ajuda" aria-keyshortcuts="?"><span>Ajuda</span></button>
      <button class="band-kit" id="openKit" type="button">
        <img id="bandSticker" alt="" hidden>
        <span>Kit da loja</span>
      </button>
    </div>
  </header>

  <main id="view" tabindex="-1"></main>

  <footer class="foot">
    <span>As capas são processadas neste computador e não saem dele.</span>
    <span class="foot-dev" id="footDev"></span>
  </footer>

  <div class="veil" id="veil" hidden>
    <div class="selo selo-giant is-filled" aria-hidden="true">
      <span class="selo-block"><svg viewBox="0 0 48 48" class="selo-glyph"><path d="M24 7v25m-10-10 10 10 10-10M9 33v8h30v-8"/></svg></span>
      <span class="selo-text"><span>Pode</span> <b>soltar</b></span>
    </div>
    <p class="veil-count" id="veilCount"></p>
  </div>

  <dialog class="inspector" id="inspector" aria-labelledby="inspectorTitle"></dialog>
  <dialog class="sheet" id="kitSheet" aria-labelledby="kitTitle"></dialog>
  <dialog class="sheet help" id="helpSheet" aria-labelledby="helpTitle"></dialog>
  <dialog class="confirm" id="confirm"></dialog>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

  <input id="pickFiles" type="file" multiple accept=".zip,.jpg,.jpeg,.jfif,.png,.webp,.avif,.gif,.tif,.tiff" hidden>
  <input id="pickFolder" type="file" webkitdirectory multiple hidden>
</body>
</html>
