<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- icon.svg on Apple's grid: an 824 × 824 tile on the 1024 canvas, with the soft
       shadow macOS icons carry. Below 48 px, icon-macos-small.svg. -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f86d2"/><stop offset="1" stop-color="#123f6b"/></linearGradient>
    <linearGradient id="art" x1="0" y1="0" x2=".55" y2="1"><stop offset="0" stop-color="#3b4858"/><stop offset="1" stop-color="#12171d"/></linearGradient>
    <radialGradient id="glow" cx=".78" cy=".16" r=".75"><stop offset="0" stop-color="#f4c37a" stop-opacity=".8"/><stop offset="1" stop-color="#f4c37a" stop-opacity="0"/></radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".18"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <filter id="lift" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity=".42"/></filter>
    <filter id="stickerShadow" x="-10%" y="-40%" width="120%" height="200%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity=".35"/></filter>
    <filter id="plateShadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".3"/></filter>
    <clipPath id="body"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
    <clipPath id="pill"><rect x="196" y="686" width="470" height="96" rx="25"/></clipPath>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#plate)" filter="url(#plateShadow)"/>
  <g clip-path="url(#body)">
    <rect x="455" y="190" width="400" height="500" rx="34" fill="#cfe2f5" opacity=".5" transform="rotate(11 650 470)"/>
    <g transform="rotate(-8 500 520)" filter="url(#lift)">
      <rect x="280" y="230" width="470" height="588" rx="38" fill="url(#art)"/>
      <rect x="280" y="230" width="470" height="588" rx="38" fill="url(#glow)"/>
      <rect x="183.5" y="673.5" width="495" height="121" rx="37.5" fill="#fff" filter="url(#stickerShadow)"/>
      <g clip-path="url(#pill)">
        <rect x="196" y="686" width="470" height="96" fill="#fff"/>
        <path d="M196 686h141l-20.4 96H196z" fill="#1D6AB2"/>
      </g>
      <path d="M363.9 734h79.9" stroke="#0b0f13" stroke-width="16.3" stroke-linecap="round"/>
      <path d="M478.3 734h122.2" stroke="#0b0f13" stroke-width="25.9" stroke-linecap="round"/>
    </g>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#sheen)"/>
</svg>
